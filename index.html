<!-- BARRE LATÉRALE (SIDEBAR) -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <i class="fa-solid fa-graduation-cap"></i>
    <h1>EduSpace</h1>
  </div>
  
  <nav class="sidebar-nav">
    <button class="nav-btn active" data-target="accueil"><i class="fa-solid fa-home"></i> Accueil</button>
    <button class="nav-btn" data-target="drive"><i class="fa-brands fa-google-drive"></i> Mon EduSchool</button>
    <button class="nav-btn" data-target="agenda"><i class="fa-solid fa-calendar-days"></i> Agenda</button>
    <!-- Extensions grisées -->
    <button class="nav-btn disabled" style="opacity: 0.5; cursor: not-allowed;" title="Bientôt disponible"><i class="fa-solid fa-puzzle-piece"></i> Extensions</button>
  </nav>

  <!-- Menu Utilisateur avec menu déroulant -->
  <div class="user-section" style="position: relative;">
    <div class="user-profile" id="userMenuBtn" style="cursor: pointer; display: flex; align-items: center; gap: 10px;">
      <i class="fa-solid fa-user-circle" style="font-size: 1.5rem;"></i>
      <span id="displayUserEmail" style="flex: 1; overflow: hidden; text-overflow: ellipsis;">Chargement...</span>
      <i class="fa-solid fa-chevron-down" style="font-size: 0.8rem;"></i>
    </div>
    
    <!-- Menu Déroulant -->
    <div id="settingsDropdownMenu" class="dropdown-menu">
      <button id="openAccountSettings"><i class="fa-solid fa-user-pen"></i> Paramètres du compte</button>
      <button id="openSecuritySettings"><i class="fa-solid fa-shield-halved"></i> Sécurité & Authentification</button>
      <hr style="margin: 5px 0; border-top: 1px solid #e2e8f0;">
      <button id="btnLogoutDropdown" style="color: #ef4444;"><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</button>
    </div>
  </div>
</aside>

<!-- MODAL : PARAMÈTRES DU COMPTE -->
<div class="modal-overlay" id="accountSettingsModal">
  <div class="modal-content">
    <h3>Paramètres du compte</h3>
    <div style="margin-top: 15px; text-align: left;">
      <label>Prénom :</label>
      <input type="text" id="profileFirstName" placeholder="Votre prénom" class="modal-input">
      
      <label style="margin-top: 10px;">Email de récupération (Sauvegarde) :</label>
      <input type="email" id="profileBackupEmail" placeholder="email@secours.com" class="modal-input">
      
      <button id="btnSaveProfile" class="btn-primary" style="margin-top: 15px; width: 100%;">Enregistrer</button>
      
      <hr style="margin: 20px 0;">
      <h4 style="color: #ef4444;">Zone de danger</h4>
      <button id="btnDeleteAccount" class="btn-secondary" style="border-color: #ef4444; color: #ef4444; width: 100%;">Fermer le compte (Supprimer)</button>
    </div>
    <button class="btn-secondary" id="closeAccountModal" style="margin-top: 15px; width: 100%;">Fermer</button>
  </div>
</div>

<!-- MODAL : SÉCURITÉ (Code PIN déplacé ici) -->
<div class="modal-overlay" id="securitySettingsModal">
  <div class="modal-content">
    <h3>Sécurité & Authentification</h3>
    <p>Code d'accès pour ce navigateur :</p>
    <div class="pin-display" id="currentDevicePin">------</div>
    <p class="pin-expiry" id="pinExpiryDate">...</p>
    <button id="btnRegeneratePin" class="btn-primary" style="width: 100%; margin-bottom: 10px;">Générer un nouveau code</button>
    <button class="btn-secondary" id="closeSecurityModal" style="width: 100%;">Fermer</button>
  </div>
</div>

<!-- SECTION AGENDA (Avec bascule Calendrier / Tâches) -->
<section id="section-agenda" class="app-section">
  <div class="agenda-header" style="display: flex; justify-content: space-between; margin-bottom: 20px;">
    <div class="month-controls">
      <button id="btnPrevMonth"><i class="fa-solid fa-chevron-left"></i></button>
      <h3 id="calendarMonthYear">Mois Année</h3>
      <button id="btnNextMonth"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
    
    <!-- Commutateur de vue Agenda -->
    <div class="view-toggle-group">
      <button id="btnAgendaCalView" class="view-btn active" title="Vue Calendrier"><i class="fa-solid fa-calendar"></i></button>
      <button id="btnAgendaTaskView" class="view-btn" title="Vue Tâches (To-Do)"><i class="fa-solid fa-list-check"></i></button>
    </div>
  </div>

  <!-- Conteneur Calendrier -->
  <div id="calendarContainer">
    <div class="calendar-days-header">
      <span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span>
    </div>
    <div class="calendar-grid" id="calendarDaysGrid"></div>
  </div>

  <!-- Conteneur Liste des Tâches -->
  <div id="tasksListContainer" style="display: none;">
    <!-- Injecté en JS -->
  </div>
</section>
